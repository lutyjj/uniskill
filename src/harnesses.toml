[pi]
label = "Pi"
pattern = "$HOME/.agents/skills/{name}"
[pi.mcp]
path = "${PI_CODING_AGENT_DIR:-$HOME/.pi/agent}/mcp.json"
format = "json"
table = ["mcpServers"]
omit = ["type"]

[claude-code]
label = "Claude Code"
pattern = "$HOME/.claude/skills/{name}"
[claude-code.mcp]
path = "${CLAUDE_CONFIG_DIR:-$HOME}/.claude.json"
format = "json"
table = ["mcpServers"]

[codex]
label = "OpenAI Codex"
pattern = "${CODEX_HOME:-$HOME/.codex}/skills/{name}"
[codex.mcp]
path = "${CODEX_HOME:-$HOME/.codex}/config.toml"
format = "toml"
table = ["mcp_servers"]
references = "fields"
omit = ["type"]
[codex.mcp.fields]
headers = "http_headers"
env_headers = "env_http_headers"
