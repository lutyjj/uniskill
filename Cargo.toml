[package]
name = "uniskill"
version = "0.3.0"
edition = "2021"
description = "Sync skills and MCP definitions into configurable agent harnesses"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
dirs = "6"
thiserror = "2"
anyhow = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
toml_edit = { version = "0.22", features = ["serde"] }
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
tiny_http = "0.12"
